<meta charset="utf-8">
<title>Cats vs Dogs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-screen landscape stage; HUD pinned top, controls in the two bottom corners, overlays for menus. Single look (dusk-purple yard). */
:root{
  --ink:#1d1230;        /* the thick outline colour of the drawings */
  --plum:#7a3fc4;       /* cat purple */
  --plum-soft:#b98ae8;
  --tang:#f28a1e;       /* dog orange */
  --sun:#ffd23f;        /* buttons, VS, stars */
  --cream:#fff4e2;      /* panels */
  --mint:#3fe0d0;       /* power meter */
  --hp:#7bdc3a;
  --hp-low:#ff5a4e;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;}
[hidden]{display:none!important;}
body{background:#2a1846;color:var(--cream);font-family:var(--body);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;inset:0;overflow:hidden;background:#2a1846;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
button{font-family:var(--display);cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px;}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none;}
.side{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:40%;}
.side.r{flex-direction:row-reverse;}
.portrait{width:clamp(44px,12vh,64px);height:clamp(44px,12vh,64px);border-radius:50%;border:4px solid var(--ink);background:#fff center/cover no-repeat;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.35);}
.barwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.side.r .barwrap{align-items:flex-end;}
.name{font-family:var(--display);font-size:clamp(13px,3.6vh,19px);letter-spacing:.04em;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);}
.bar{width:100%;height:clamp(12px,3.6vh,20px);border:3px solid var(--ink);border-radius:999px;background:#3b2457;overflow:hidden;position:relative;}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(#a6f06a,var(--hp) 55%,#52b51f);border-radius:999px;transition:width .15s;}
.side.r .bar i{inset:0 0 0 auto;}
.bar i.low{background:linear-gradient(#ff9a8f,var(--hp-low) 55%,#c7302a);}
.bar b{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.6;border-radius:999px;transition:width .6s .25s;}
.side.r .bar b{inset:0 0 0 auto;}
#mid{display:flex;flex-direction:column;align-items:center;flex:none;}
#vs{font-family:var(--display);font-size:clamp(20px,6vh,34px);color:var(--sun);line-height:1;text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink);transform:rotate(-6deg);}
#timer{margin-top:2px;font-family:var(--display);font-size:clamp(18px,5.4vh,30px);background:var(--ink);color:#fff;border-radius:12px;padding:0 10px;font-variant-numeric:tabular-nums;min-width:2.4em;text-align:center;}
#timer.hot{color:var(--hp-low);}
#pauseBtn{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:var(--plum);color:#fff;font-size:18px;box-shadow:0 3px 0 var(--ink);display:none;}
#hud.on ~ #pauseBtn{display:block;}
#hud .side.r{margin-right:44px;}

/* power meter */
#power{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;align-items:center;gap:6px;pointer-events:none;}
#power img{width:clamp(30px,8vh,44px);filter:drop-shadow(0 2px 0 rgba(0,0,0,.4));}
#segs{display:flex;gap:3px;padding:4px;border:3px solid var(--ink);border-radius:999px;background:#3b2457;}
#segs span{width:clamp(14px,4vw,26px);height:clamp(10px,3vh,16px);border-radius:5px;background:#5b437a;}
#segs span.on{background:linear-gradient(#a8fff6,var(--mint));}
#power.full #segs{animation:glow .6s infinite alternate;}
@keyframes glow{to{box-shadow:0 0 14px 4px var(--sun);border-color:#7a4b00;}}

/* ---------- controls ---------- */
#controls{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));}
#controls.on{display:flex;}
.pad{display:flex;gap:10px;pointer-events:auto;}
.ctl{--s:clamp(58px,19vh,92px);width:var(--s);height:var(--s);border-radius:50%;border:4px solid var(--ink);padding:0;background:var(--plum) center/cover no-repeat;
  box-shadow:0 5px 0 var(--ink);position:relative;touch-action:none;transition:transform .06s, filter .2s;color:#fff;}
.ctl.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.ctl.arrow{background:linear-gradient(#a26ae6,var(--plum));font-size:calc(var(--s)*.42);line-height:1;text-shadow:0 3px 0 var(--ink);}
.ctl .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(29,18,48,.72) var(--p,0%),transparent 0);pointer-events:none;}
.atk{display:grid;grid-template-columns:repeat(3,auto);grid-template-rows:auto auto;gap:8px 10px;pointer-events:auto;align-items:end;justify-items:center;}
.atk .ctl{--s:clamp(54px,17.5vh,86px);}
#spBtn{background:radial-gradient(circle at 50% 40%,#fff3a8,var(--sun) 60%,#e5a400);font-size:calc(var(--s)*.46);filter:grayscale(.85) brightness(.75);}
#spBtn.ready{filter:none;animation:pulse .7s infinite alternate;}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 5px 0 var(--ink),0 0 22px 6px var(--sun);}}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));}
.dim{background:rgba(29,18,48,.55);}
#title{gap:clamp(12px,4vw,40px);}
#title .logo{width:min(40vw,62vh);filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg);}}
.pick{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2vh,14px);}
.pick h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(18px,5.5vh,30px);letter-spacing:.03em;color:#fff;text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);}
.cards{display:flex;gap:clamp(8px,2vw,18px);}
.card{width:clamp(120px,22vw,190px);background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 var(--ink);transition:transform .15s;}
.card img{height:clamp(70px,24vh,140px);object-fit:contain;}
.card .cn{font-family:var(--display);font-size:clamp(16px,4.6vh,24px);}
.card .tag{font-size:clamp(10px,2.8vh,13px);font-weight:600;opacity:.75;}
.card.cat{background:linear-gradient(#f6e9ff,#e3c7ff);}
.card.dog{background:linear-gradient(#fff2df,#ffd6a6);}
.card.sel{transform:translateY(-6px) rotate(-1deg);box-shadow:0 10px 0 var(--ink),0 0 0 5px var(--sun);}
.stats{width:100%;display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;font-size:clamp(9px,2.5vh,12px);font-weight:700;margin-top:2px;}
.stats u{display:block;height:7px;border-radius:9px;background:rgba(29,18,48,.15);overflow:hidden;text-decoration:none;}
.stats u i{display:block;height:100%;background:var(--ink);border-radius:9px;}
.imgbtn{background:none;border:0;padding:0;}
.imgbtn img{height:clamp(52px,15vh,84px);display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3));transition:transform .1s;}
.imgbtn:active img{transform:scale(.95);}
.hint{font-size:clamp(10px,2.6vh,13px);opacity:.85;text-align:center;max-width:46ch;}
.panel{background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:clamp(10px,3vh,22px) clamp(16px,4vw,34px);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2vh,12px);text-align:center;max-height:100%;}
.panel h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,10vh,58px);line-height:1;color:var(--sun);text-shadow:0 4px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink);}
.panel h1.lose{color:var(--plum-soft);}
.panel p{margin:0;font-weight:600;font-size:clamp(12px,3.4vh,16px);}
.stars{display:flex;gap:6px;}
.stars img{width:clamp(30px,10vh,52px);transition:transform .3s;}
.stars img.off{filter:grayscale(1) brightness(1.6) opacity(.45);}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{border:4px solid var(--ink);border-radius:999px;background:var(--plum);color:#fff;font-size:clamp(14px,4vh,20px);padding:6px 18px;box-shadow:0 4px 0 var(--ink);}
.pill.alt{background:#fff;color:var(--ink);}
#resultPose{height:clamp(70px,24vh,150px);}
#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%) scale(0);font-family:var(--display);font-size:clamp(26px,9vh,56px);white-space:nowrap;color:var(--sun);
  text-shadow:0 4px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink);pointer-events:none;}
#banner.show{animation:pop 1.5s ease-out forwards;}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg);}15%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);}25%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);}80%{opacity:1;}100%{transform:translate(-50%,-60%) scale(1);opacity:0;}}
#rotate{background:#2a1846;flex-direction:column;gap:14px;z-index:20;display:none;font-family:var(--display);font-size:22px;text-align:center;}
#rotate .ph{width:54px;height:90px;border:5px solid var(--cream);border-radius:12px;animation:turn 1.6s ease-in-out infinite;}
@keyframes turn{40%,60%{transform:rotate(-90deg);}}
@media (orientation:portrait){#rotate{display:flex;}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;}}
</style>

<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="side l"><div class="portrait" id="pL"></div><div class="barwrap"><div class="name" id="nL">CAT</div><div class="bar"><b id="gL"></b><i id="hL"></i></div></div></div>
    <div id="mid"><div id="vs">VS</div><div id="timer">60</div></div>
    <div class="side r"><div class="portrait" id="pR"></div><div class="barwrap"><div class="name" id="nR">DOG</div><div class="bar"><b id="gR"></b><i id="hR"></i></div></div></div>
  </div>
  <button id="pauseBtn" aria-label="Pause">❚❚</button>
  <div id="power" hidden><img id="powIcon" src="assets/ui/fish.png" alt=""><div id="segs"></div></div>

  <div id="controls">
    <div class="pad">
      <button class="ctl arrow" id="bLeft" aria-label="Move left">◀</button>
      <button class="ctl arrow" id="bRight" aria-label="Move right">▶</button>
    </div>
    <div class="atk" id="atkPad"></div>
  </div>

  <div id="banner"></div>

  <!-- Title / pick -->
  <div class="ov dim" id="title">
    <img class="logo" src="assets/ui/logo.png" alt="Cats vs Dogs">
    <div class="pick">
      <h2>Choose your fighter</h2>
      <div class="cards">
        <button class="card cat sel" data-k="cat"><img src="assets/sprites/cat_stand.png" alt=""><span class="cn">Purple Tabby</span><span class="tag">fast · jumps · scratches</span>
          <span class="stats"><span>Speed</span><u><i style="width:90%"></i></u><span>Power</span><u><i style="width:55%"></i></u><span>Health</span><u><i style="width:60%"></i></u></span></button>
        <button class="card dog" data-k="dog"><img src="assets/sprites/dog_stand.png" alt=""><span class="cn">Bulldog</span><span class="tag">strong · barks · charges</span>
          <span class="stats"><span>Speed</span><u><i style="width:55%"></i></u><span>Power</span><u><i style="width:85%"></i></u><span>Health</span><u><i style="width:85%"></i></u></span></button>
      </div>
      <button class="imgbtn" id="playBtn" aria-label="Play"><img src="assets/ui/btn_play.png" alt=""></button>
      <div class="hint">Collect your food 🐟🦴 to fill the power meter, then hit ⚡ for a special move!</div>
    </div>
  </div>

  <!-- Result -->
  <div class="ov dim" id="result" hidden>
    <div class="panel">
      <h1 id="resTitle">YOU WIN!</h1>
      <img id="resultPose" src="" alt="">
      <div class="stars" id="resStars"><img src="assets/ui/star.png" alt=""><img src="assets/ui/star.png" alt=""><img src="assets/ui/star.png" alt=""></div>
      <p id="resText"></p>
      <div class="row">
        <button class="imgbtn" id="againBtn" aria-label="Play again"><img src="assets/ui/btn_play.png" alt=""></button>
        <button class="pill alt" id="menuBtn">Change fighter</button>
      </div>
    </div>
  </div>

  <!-- Pause -->
  <div class="ov dim" id="pause" hidden>
    <div class="panel">
      <h1>PAUSED</h1>
      <div class="row">
        <button class="pill" id="resumeBtn">Resume</button>
        <button class="pill alt" id="soundBtn">Sound: on</button>
        <button class="pill alt" id="quitBtn">Quit</button>
      </div>
    </div>
  </div>

  <div class="ov" id="rotate"><div class="ph"></div>Turn your phone sideways</div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------------- assets ---------------- */
const META={"cat_stand":{"w":257,"h":233,"ax":134},"cat_walk":{"w":256,"h":184,"ax":117},"cat_scratch":{"w":290,"h":223,"ax":130},"cat_jump":{"w":289,"h":185,"ax":121},"cat_bite":{"w":301,"h":210,"ax":161},"cat_hiss":{"w":257,"h":233,"ax":133},"cat_ready":{"w":251,"h":219,"ax":122},"cat_surprised":{"w":247,"h":230,"ax":116},"cat_hit":{"w":262,"h":229,"ax":143},"cat_sleep":{"w":272,"h":205,"ax":141},"dog_stand":{"w":223,"h":201,"ax":105},"dog_walk":{"w":219,"h":165,"ax":91},"dog_bite":{"w":283,"h":191,"ax":102},"dog_bark":{"w":261,"h":205,"ax":99},"dog_charge":{"w":300,"h":167,"ax":128},"dog_ready":{"w":235,"h":223,"ax":100},"dog_surprised":{"w":217,"h":192,"ax":99},"dog_tongue":{"w":242,"h":184,"ax":107},"dog_hit":{"w":216,"h":201,"ax":109},"dog_sleep":{"w":292,"h":181,"ax":145}};
const IMG={}, WHITE={};
function load(key,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[key]=i;r();};i.onerror=()=>r();i.src=src;});}
const loads=[load('arena','assets/arena.jpg'),load('fish','assets/ui/fish.png'),load('bone','assets/ui/bone.png'),load('box','assets/ui/box.png'),load('star','assets/ui/star.png')];
for(const k in META) loads.push(load(k,'assets/sprites/'+k+'.png'));
const ready=Promise.all(loads).then(()=>{for(const k in META){const i=IMG[k];if(!i)continue;const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const g=c.getContext('2d');g.drawImage(i,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);WHITE[k]=c;}});

/* ---------------- sound (tiny synth) ---------------- */
let AC=null, soundOn=true;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f1,f2,dur,type='square',vol=.15,delay=0){if(!AC||!soundOn)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,f,q=1,vol=.25,type='bandpass'){if(!AC||!soundOn)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(AC.destination);s.start(t);}
const SND={
  slash:()=>noise(.14,3200,1.5,.3),
  bite:()=>{tone(220,90,.12,'square',.18);noise(.08,900,2,.2);},
  hiss:()=>noise(.5,5000,.7,.22,'highpass'),
  bark:()=>{tone(320,140,.13,'sawtooth',.22);tone(300,120,.15,'sawtooth',.2,.17);},
  jump:()=>tone(300,700,.18,'triangle',.15),
  hit:()=>{tone(160,60,.15,'square',.2);noise(.1,600,1,.25);},
  charge:()=>noise(.4,400,.6,.3,'lowpass'),
  pick:()=>{tone(660,990,.08,'triangle',.18);tone(990,1320,.1,'triangle',.18,.08);},
  box:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,.12,'triangle',.15,i*.07));},
  special:()=>{tone(200,900,.5,'sawtooth',.18);noise(.6,1200,.5,.25);},
  ko:()=>{tone(500,80,.8,'triangle',.25);},
  win:()=>{[523,659,784,659,784,1046].forEach((f,i)=>tone(f,f,.16,'square',.12,i*.13));},
  lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,f*.97,.25,'triangle',.15,i*.22));},
  count:()=>tone(440,440,.12,'square',.15), go:()=>tone(880,880,.3,'square',.18),
};
function sfx(n){try{SND[n]&&SND[n]();}catch(e){}}

/* ---------------- fighter data ---------------- */
const KIND={
  cat:{name:'PURPLE TABBY',hp:100,speed:430,scale:1.22,food:'fish',
    idle:'ready',walk:'walk',hit:'hit',stun:'surprised',ko:'sleep',win:'hiss',
    attacks:{
      slash:{pose:'scratch',wind:.07,act:.12,rec:.16,range:175,dmg:6,kb:110,cd:.38,snd:'slash',fx:'slash',lunge:30},
      bite:{pose:'bite',wind:.14,act:.12,rec:.28,range:150,dmg:11,kb:200,cd:.9,snd:'bite',fx:'chomp',lunge:85},
      jump:{jump:true,cd:.85},
      hiss:{pose:'hiss',wind:.1,act:.22,rec:.35,range:330,dmg:2,stun:1.0,cd:4.5,snd:'hiss',fx:'hiss',air:true},
    },
    buttons:[['jump','assets/ui/atk_cat_jump.png'],['hiss','assets/ui/atk_cat_hiss.png'],['sp',null],['slash','assets/ui/atk_cat_slash.png'],['bite','assets/ui/atk_cat_bite.png']],
    portrait:'assets/ui/atk_cat_bite.png', special:'MEGA CAT!'},
  dog:{name:'BULLDOG',hp:115,speed:350,scale:1.32,food:'bone',
    idle:'ready',walk:'walk',hit:'hit',stun:'surprised',ko:'sleep',win:'tongue',
    attacks:{
      bite:{pose:'bite',wind:.15,act:.12,rec:.3,range:170,dmg:13,kb:230,cd:.9,snd:'bite',fx:'chomp',lunge:80},
      bark:{pose:'bark',wind:.14,act:.25,rec:.35,range:390,dmg:3,stun:1.0,cd:4.5,snd:'bark',fx:'bark',air:true},
      charge:{pose:'charge',dash:1150,act:.42,wind:.08,rec:.3,dmg:12,kb:420,cd:2.6,snd:'charge',range:120},
    },
    buttons:[['bark','assets/ui/atk_dog_bark.png'],['sp',null],['charge','assets/ui/atk_dog_charge.png'],['bite','assets/ui/atk_dog_bite.png']],
    portrait:'assets/ui/atk_dog_bark.png', special:'TORNADO BARK!'},
};

/* ---------------- world ---------------- */
const VH=900; let VW=1600, S=1, DPR=1, groundY=800, bgS=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);const w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);S=cv.height/VH;VW=cv.width/S;
  bgS=Math.max(VW/1672,VH/941);groundY=VH-88*bgS;}
window.addEventListener('resize',resize);

let G=null; // game state
let player='cat', paused=false, phase='title';
function makeFighter(kind,x,face,isAI){const K=KIND[kind];return{kind,K,x,y:0,vx:0,vy:0,face,hp:K.hp,maxhp:K.hp,ghost:K.hp,power:0,state:'idle',t:0,atk:null,atkName:'',hitDone:false,
  cds:{},giant:0,speedUp:0,flash:0,shake:0,ai:isAI?{think:0,move:0,want:null}:null,moveIn:0,pounced:false,walkT:0,stunT:0};}

function newGame(){
  const other=player==='cat'?'dog':'cat';
  G={time:60,over:false,t:0,shake:0,fx:[],parts:[],texts:[],items:[],box:null,nextItem:3,nextBox:rand(14,18),slow:0,count:3.2,
    me:makeFighter(player,VW*.3,1,false), cpu:makeFighter(other,VW*.7,-1,true)};
  $('pL').style.backgroundImage=`url(${KIND[player].portrait})`;$('pR').style.backgroundImage=`url(${KIND[other].portrait})`;
  $('nL').textContent='YOU · '+KIND[player].name;$('nR').textContent=KIND[other].name;
  $('powIcon').src=`assets/ui/${KIND[player].food}.png`;
  buildButtons();
  phase='count';paused=false;
  ['title','result','pause'].forEach(id=>$(id).hidden=true);
  $('hud').hidden=false;$('hud').classList.add('on');$('power').hidden=false;$('controls').classList.add('on');
  updateHUD(true);
}

/* ---------------- input ---------------- */
const input={left:false,right:false};
function bindHold(el,key){const on=e=>{e.preventDefault();audio();input[key]=true;el.classList.add('down');try{el.setPointerCapture(e.pointerId);}catch(_){}} ,off=e=>{input[key]=false;el.classList.remove('down');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);el.addEventListener('contextmenu',e=>e.preventDefault());}
bindHold($('bLeft'),'left');bindHold($('bRight'),'right');
const btnEls={};
function buildButtons(){const pad=$('atkPad');pad.innerHTML='';for(const k in btnEls)delete btnEls[k];
  for(const [name,src] of KIND[player].buttons){const b=document.createElement('button');b.className='ctl';b.setAttribute('aria-label',name==='sp'?'Special move':name);
    if(name==='sp'){b.id='spBtn';b.textContent='⚡';}else{b.style.backgroundImage=`url(${src})`;const c=document.createElement('span');c.className='cd';b.appendChild(c);}
    b.addEventListener('pointerdown',e=>{e.preventDefault();audio();b.classList.add('down');setTimeout(()=>b.classList.remove('down'),120);if(phase==='fight'&&!paused)name==='sp'?special(G.me):tryAttack(G.me,name);});
    b.addEventListener('contextmenu',e=>e.preventDefault());pad.appendChild(b);btnEls[name]=b;}
}
const KEYS={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
window.addEventListener('keydown',e=>{audio();if(KEYS[e.key]){input[KEYS[e.key]]=true;e.preventDefault();return;}if(phase!=='fight'||paused)return;
  const names=KIND[player].buttons.map(b=>b[0]).filter(n=>n!=='sp');const map={j:0,k:1,l:2,';':3,z:0,x:1,c:2,v:3};
  if(e.key===' '){special(G.me);e.preventDefault();}else if(e.key==='ArrowUp'||e.key==='w'){tryAttack(G.me,player==='cat'?'jump':'charge');}else if(map[e.key]!=null&&names[map[e.key]])tryAttack(G.me,names[map[e.key]]);
  else if(e.key==='Escape')setPause(true);});
window.addEventListener('keyup',e=>{if(KEYS[e.key])input[KEYS[e.key]]=false;});

/* ---------------- combat ---------------- */
const canAct=f=>['idle','walk'].includes(f.state);
function tryAttack(f,name){const A=f.K.attacks[name];if(!A||!canAct(f)||(f.cds[name]||0)>0)return false;
  if(name==='jump'){if(f.y<0)return false;f.cds.jump=A.cd;f.state='jump';f.t=0;f.vy=-1180;const dir=f===G.me?(input.right?1:input.left?-1:f.face):(f.ai.move||f.face);f.vx=dir*480;f.pounced=false;sfx('jump');burst(f.x,groundY,'#fff',6,140,'dust');return true;}
  f.cds[name]=A.cd;f.state='attack';f.atk=A;f.atkName=name;f.t=0;f.hitDone=false;return true;}
function opponent(f){return f===G.me?G.cpu:G.me;}
function dmgMul(f){return f.giant>0?1.8:1;}
function applyHit(att,tgt,A,mult=1){
  if(tgt.state==='ko')return;
  let d=A.dmg*dmgMul(att)*mult; if(tgt.giant>0)d*=.5; if(att.ai)d*=.8;
  tgt.hp=Math.max(0,tgt.hp-d);tgt.flash=.12;tgt.shake=.25;
  att.power=Math.min(100,att.power+5);
  const dir=Math.sign(tgt.x-att.x)||att.face;
  if(A.stun){tgt.state='stun';tgt.t=0;tgt.stunT=A.stun*(mult>1?1.5:1);tgt.vx=dir*A.kb*.4||dir*60;}
  else{tgt.state='hurt';tgt.t=0;tgt.vx=dir*(A.kb||150);}
  if(tgt.y<0&&!A.stun){tgt.vy=Math.min(tgt.vy,-300);}
  G.shake=Math.max(G.shake,A.dmg>10?.25:.12);
  burst(tgt.x,groundY+tgt.y-110*tgt.K.scale,'#ffd23f',10,380,'star');
  sfx(A.stun?'hit':'hit');
  if(tgt.hp<=0)ko(tgt,att);
}
function ko(loser,winner){loser.state='ko';loser.t=0;loser.vx=Math.sign(loser.x-winner.x)*300;loser.vy=-500;G.over=true;G.slow=1.2;sfx('ko');comic('K.O.!',VW/2,VH*.42,'#ff5a4e',2.2,1.6);setTimeout(()=>endGame(),2300);}
function special(f){if(f.power<100||!canAct(f))return;f.power=0;sfx('special');G.shake=.5;
  if(f.kind==='cat'){f.giant=6;comic(f.K.special,f.x,groundY-330,'#ff6fd8',1.6,1.3);burst(f.x,groundY-100,'#ff6fd8',26,600,'star');}
  else{f.state='attack';f.atk={pose:'bark',wind:.15,act:.5,rec:.4,range:9999,dmg:18,stun:1.6,air:true,snd:'bark',fx:'tornado',kb:300};f.atkName='tornado';f.t=0;f.hitDone=false;comic(f.K.special,f.x,groundY-330,'#ffd23f',1.6,1.3);}
  if(f===G.me)banner(f.K.special);
}
function inRange(att,tgt,A){const dx=(tgt.x-att.x)*att.face;const reach=A.range*(att.giant>0?1.45:1)*(att.K.scale/1.15);
  if(dx<-40||Math.abs(tgt.x-att.x)>reach)return false;if(!A.air&&tgt.y<-110)return false;return true;}

/* ---------------- effects ---------------- */
function burst(x,y,color,n,sp,type){for(let i=0;i<n;i++){const a=type==='dust'?rand(Math.PI,2*Math.PI):rand(0,Math.PI*2),v=rand(sp*.4,sp);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(type==='star'?200:40),life:rand(.4,.8),t:0,color,type,r:rand(8,16),rot:rand(0,6)});}}
function comic(txt,x,y,color,size=1,life=.8){G.texts.push({txt,x,y,color,size,life,t:0,rot:rand(-.2,.2)});}
function banner(txt){const b=$('banner');b.textContent=txt;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}

/* ---------------- items ---------------- */
function spawnItem(type){type=type||(Math.random()<.5?'fish':'bone');G.items.push({type,x:rand(VW*.15,VW*.85),y:-VH*.9,vy:0,life:9,t:0,landed:false});}
function openBox(by){const b=G.box;G.box=null;sfx('box');burst(b.x,groundY-60,'#ffd23f',24,500,'star');
  const r=pick(['heal','power','speed','boom','rain']);
  if(r==='heal'){by.hp=Math.min(by.maxhp,by.hp+25);comic('+25 HEALTH!',b.x,groundY-260,'#7bdc3a',1.2,1.2);}
  else if(r==='power'){by.power=100;comic('FULL POWER!',b.x,groundY-260,'#3fe0d0',1.2,1.2);}
  else if(r==='speed'){by.speedUp=6;comic('SPEED UP!',b.x,groundY-260,'#ffd23f',1.2,1.2);}
  else if(r==='boom'){for(const f of [G.me,G.cpu]){if(f.state!=='ko'){f.state='stun';f.t=0;f.stunT=.9;f.vx=Math.sign(f.x-b.x||1)*500;}}G.shake=.5;comic('BOOM!',b.x,groundY-260,'#ff5a4e',1.6,1.1);}
  else{for(let i=0;i<4;i++)setTimeout(()=>G&&!G.over&&spawnItem(),i*250);comic('FOOD RAIN!',b.x,groundY-260,'#3fe0d0',1.2,1.2);}
  if(by===G.me)banner(r==='heal'?'+25 HEALTH':r==='power'?'FULL POWER':r==='speed'?'SPEED UP':r==='boom'?'BOOM!':'FOOD RAIN');
}

/* ---------------- AI ---------------- */
function aiThink(f){const o=G.me,A=f.K.attacks,dx=o.x-f.x,dist=Math.abs(dx),ai=f.ai;ai.think=rand(.32,.6);ai.move=0;
  if(!canAct(f))return;
  if(f.power>=100&&(f.kind==='dog'||dist<450)){special(f);return;}
  const mine=G.items.filter(i=>i.type===f.K.food&&i.landed);
  let goal=null;for(const it of mine){if(Math.abs(it.x-f.x)<Math.abs(it.x-o.x)+120&&(!goal||Math.abs(it.x-f.x)<Math.abs(goal.x-f.x)))goal=it;}
  if(!goal&&G.box&&G.box.landed&&Math.abs(G.box.x-f.x)<Math.abs(G.box.x-o.x))goal=G.box;
  if(goal&&dist>200){ai.move=Math.sign(goal.x-f.x);return;}
  const opts=[];
  for(const n in A){const a=A[n];if((f.cds[n]||0)>0)continue;
    if(n==='jump'){if(o.state==='attack'&&dist<260&&Math.random()<.45)opts.push([n,3]);else if(dist>250&&dist<520&&Math.random()<.25)opts.push([n,1]);continue;}
    if(a.dash){if(dist>220&&dist<700)opts.push([n,1.5]);continue;}
    if(inRange(f,o,a))opts.push([n,a.stun?(o.state==='stun'?0:1.2):a.dmg>10?2:3]);}
  if(opts.length&&Math.random()<.62){let s=opts.reduce((a,b)=>a+b[1],0),r=Math.random()*s;for(const [n,w] of opts){r-=w;if(r<=0){tryAttack(f,n);return;}}}
  if(dist>150)ai.move=Math.sign(dx); else if(Math.random()<.3)ai.move=-Math.sign(dx);
}

/* ---------------- update ---------------- */
function updFighter(f,dt){const K=f.K,o=opponent(f);f.t+=dt;
  for(const k in f.cds)f.cds[k]=Math.max(0,f.cds[k]-dt);
  f.giant=Math.max(0,f.giant-dt);f.speedUp=Math.max(0,f.speedUp-dt);f.flash=Math.max(0,f.flash-dt);f.shake=Math.max(0,f.shake-dt);
  if(f.ghost>f.hp)f.ghost=Math.max(f.hp,f.ghost-dt*25);
  const spd=K.speed*(f.speedUp>0?1.5:1)*(f.giant>0?.85:1);
  let move=0;
  if(f.state==='idle'||f.state==='walk'){
    move=f.ai?f.ai.move:(input.right?1:0)-(input.left?1:0);
    if(G.over||phase!=='fight')move=0;
    f.vx=move*spd;f.state=move?'walk':'idle';if(move)f.walkT+=dt;
    if(!f.atk)f.face=Math.sign(o.x-f.x)||f.face;
  } else if(f.state==='attack'){
    const A=f.atk,tot=A.wind+A.act+A.rec;
    if(A.dash){f.vx=f.t>A.wind&&f.t<A.wind+A.act?f.face*A.dash:f.vx*.85;
      if(!f.hitDone&&f.t>A.wind&&f.t<A.wind+A.act&&Math.abs(o.x-f.x)<150*f.K.scale&&o.y>-110){f.hitDone=true;applyHit(f,o,A);f.vx*=.2;}}
    else{f.vx*=.8;if(!f.hitDone&&f.t>=A.wind){f.hitDone=true;if(A.snd)sfx(A.snd);fxFor(f,A);
      if(A.fx==='tornado'||inRange(f,o,A))applyHit(f,o,A);}}
    if(f.t>=tot){f.state='idle';f.atk=null;}
  } else if(f.state==='jump'){
    if(!f.pounced&&f.vy>0&&Math.abs(o.x-f.x)<140*K.scale&&f.y>-170&&o.state!=='ko'){f.pounced=true;applyHit(f,o,{dmg:9,kb:260},1);comic('POUNCE!',o.x,groundY-280,'#ff6fd8',1,.7);}
  } else if(f.state==='hurt'){f.vx*=.88;if(f.t>.32)f.state='idle';}
  else if(f.state==='stun'){f.vx*=.88;if(f.t>f.stunT)f.state='idle';}
  else if(f.state==='ko'||f.state==='win'){f.vx*=.9;}
  // physics
  f.x+=f.vx*dt;
  if(f.y<0||f.vy<0){f.vy+=3000*dt;f.y+=f.vy*dt;if(f.y>=0){f.y=0;f.vy=0;if(f.state==='jump'){f.state='idle';burst(f.x,groundY,'#fff',6,160,'dust');}}}
  f.x=clamp(f.x,90,VW-90);
}
function fxFor(f,A){const x=f.x+f.face*120*f.K.scale,y=groundY+f.y-110*f.K.scale;
  if(A.fx==='slash'){G.fx.push({type:'slash',x,y,face:f.face,t:0,life:.2,s:f.giant>0?1.5:1});}
  else if(A.fx==='chomp'){comic(pick(['CHOMP!','NOM!','CRUNCH!']),x,y-90,'#fff',.9,.6);}
  else if(A.fx==='hiss'){G.fx.push({type:'wave',x:f.x+f.face*90,y,face:f.face,t:0,life:.45,color:'#ffd23f'});comic('HSSSS!',x+f.face*40,y-80,'#ffd23f',1,.7);}
  else if(A.fx==='bark'){G.fx.push({type:'wave',x:f.x+f.face*100,y,face:f.face,t:0,life:.5,color:'#fff'});comic('WOOF!',x+f.face*40,y-90,'#fff',1.1,.7);}
  else if(A.fx==='tornado'){for(let i=0;i<3;i++)G.fx.push({type:'wave',x:f.x+f.face*100,y,face:f.face,t:-i*.12,life:.9,color:'#ffd23f',big:true});G.shake=.6;}
}
function update(dt){
  if(!G)return;
  if(phase==='count'){const prev=Math.ceil(G.count);G.count-=dt;const now=Math.ceil(G.count);
    if(now!==prev){if(now>=1&&now<=3){comic(String(now),VW/2,VH*.42,'#ffd23f',2.2,.8);sfx('count');}else if(now===0){comic('FIGHT!',VW/2,VH*.42,'#ff6fd8',2.4,.9);sfx('go');phase='fight';}}}
  if(G.slow>0){G.slow-=dt;dt*=.35;}
  G.t+=dt;
  if(phase==='fight'&&!G.over){G.time-=dt;if(G.time<=0){G.time=0;timeUp();}
    G.nextItem-=dt;if(G.nextItem<=0){G.nextItem=rand(4.5,7.5);if(G.items.length<3)spawnItem();}
    G.nextBox-=dt;if(G.nextBox<=0){G.nextBox=rand(16,22);if(!G.box)G.box={x:rand(VW*.35,VW*.65),y:-VH,vy:0,landed:false,t:0};}
    if(G.cpu.ai){G.cpu.ai.think-=dt;if(G.cpu.ai.think<=0)aiThink(G.cpu);}
  }
  for(const f of [G.me,G.cpu])updFighter(f,dt);
  // body separation
  const a=G.me,b=G.cpu,minD=135*((a.K.scale+b.K.scale)/2)*(a.giant||b.giant?1.3:1);
  if(a.y>-60&&b.y>-60&&a.state!=='ko'&&b.state!=='ko'){const d=b.x-a.x;if(Math.abs(d)<minD){const push=(minD-Math.abs(d))/2*(Math.sign(d)||1);a.x=clamp(a.x-push,90,VW-90);b.x=clamp(b.x+push,90,VW-90);}}
  // items
  for(const it of G.items){it.t+=dt;if(!it.landed){it.vy+=2200*dt;it.y+=it.vy*dt;if(it.y>=0){it.y=0;if(it.vy>400){it.vy*=-.35;}else{it.vy=0;it.landed=true;}}}else it.life-=dt;
    for(const f of [G.me,G.cpu]){if(f.K.food===it.type&&f.state!=='ko'&&Math.abs(f.x-it.x)<95*f.K.scale&&f.y>-160&&it.y>-200){it.life=-1;f.power=Math.min(100,f.power+34);sfx('pick');burst(it.x,groundY-40,'#3fe0d0',12,300,'star');comic('+POWER',it.x,groundY-180,'#3fe0d0',.8,.7);}}}
  G.items=G.items.filter(i=>i.life>0);
  if(G.box){const bx=G.box;bx.t+=dt;if(!bx.landed){bx.vy+=2200*dt;bx.y+=bx.vy*dt;if(bx.y>=0){bx.y=0;if(bx.vy>400){bx.vy*=-.3;G.shake=.15;}else{bx.vy=0;bx.landed=true;}}}
    else for(const f of [G.me,G.cpu]){if(f.state!=='ko'&&Math.abs(f.x-bx.x)<100*f.K.scale&&f.y>-150){openBox(f);break;}}}
  // effects
  for(const p of G.parts){p.t+=dt;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*6;}
  G.parts=G.parts.filter(p=>p.t<p.life);
  for(const e of G.fx)e.t+=dt;G.fx=G.fx.filter(e=>e.t<e.life);
  for(const t of G.texts)t.t+=dt;G.texts=G.texts.filter(t=>t.t<t.life);
  G.shake=Math.max(0,G.shake-dt);
  updateHUD();
}
function timeUp(){const me=G.me.hp/G.me.maxhp,cp=G.cpu.hp/G.cpu.maxhp;G.over=true;comic('TIME!',VW/2,VH*.42,'#ffd23f',2.2,1.4);
  if(Math.abs(me-cp)<.001){G.draw=true;}else{const l=me<cp?G.me:G.cpu;l.state='ko';l.t=0;}
  setTimeout(()=>endGame(),1800);}

/* ---------------- HUD ---------------- */
let lastHUD={};
function updateHUD(force){if(!G)return;const me=G.me,cp=G.cpu;
  const set=(id,v,low)=>{const el=$(id);const w=(v*100).toFixed(1)+'%';if(force||lastHUD[id]!==w){el.style.width=w;lastHUD[id]=w;if(low!==undefined)el.classList.toggle('low',low);}};
  set('hL',me.hp/me.maxhp,me.hp/me.maxhp<.3);set('hR',cp.hp/cp.maxhp,cp.hp/cp.maxhp<.3);set('gL',me.ghost/me.maxhp);set('gR',cp.ghost/cp.maxhp);
  const tm=Math.ceil(G.time);if(force||lastHUD.t!==tm){$('timer').textContent=tm;$('timer').classList.toggle('hot',tm<=10);lastHUD.t=tm;}
  const segs=$('segs');if(!segs.children.length)for(let i=0;i<6;i++)segs.appendChild(document.createElement('span'));
  const on=Math.floor(me.power/100*6+.001);if(force||lastHUD.p!==on){[...segs.children].forEach((s,i)=>s.classList.toggle('on',i<on));$('power').classList.toggle('full',me.power>=100);lastHUD.p=on;}
  const sp=btnEls.sp;if(sp)sp.classList.toggle('ready',me.power>=100);
  for(const n in btnEls){if(n==='sp')continue;const A=me.K.attacks[n],c=me.cds[n]||0,el=btnEls[n].firstChild;const p=A&&c>0?Math.round(c/A.cd*100)+'%':'0%';if(el&&el._p!==p){el.style.setProperty('--p',p);el._p=p;}}
}

/* ---------------- render ---------------- */
function poseOf(f){const K=f.K;
  switch(f.state){
    case 'walk': return Math.floor(f.walkT*7)%2?K.walk:K.idle;
    case 'attack': return f.t<f.atk.wind?K.idle:f.atk.pose;
    case 'jump': return 'jump';
    case 'hurt': return K.hit;
    case 'stun': return K.stun;
    case 'ko': return K.ko;
    case 'win': return K.win;
    default: return phase==='title'?'stand':K.idle;}}
function drawFighter(f,t){
  let pose=poseOf(f);let key=f.kind+'_'+pose;if(!META[key]||!IMG[key])key=f.kind+'_stand';
  const m=META[key],img=IMG[key];if(!img)return;
  let sc=f.K.scale*(1+Math.min(f.giant,1)*0.55*(f.giant>0?1:0));
  if(f.giant>0&&f.giant<1)sc=f.K.scale*(1+.55*f.giant);
  let sx=1,sy=1,ox=0,oy=0,rot=0;
  if(f.state==='idle'){const b=Math.sin(t*4.2+(f.kind==='dog'?1:0));sy=1+b*.03;sx=1-b*.015;}
  else if(f.state==='walk'){oy=-Math.abs(Math.sin(f.walkT*14))*12;rot=Math.sin(f.walkT*14)*.03;}
  else if(f.state==='attack'){const A=f.atk;if(f.t<A.wind){const k=f.t/A.wind;sx=1+.08*k;sy=1-.08*k;ox=-f.face*12*k;}
    else if(f.t<A.wind+A.act){const k=(f.t-A.wind)/A.act;sx=1.06-.06*k;sy=.96+.06*k;ox=f.face*(A.lunge||0)*Math.sin(Math.min(1,k*1.5)*Math.PI/2);}
    else{const k=(f.t-A.wind-A.act)/A.rec;ox=f.face*(A.lunge||0)*(1-k);}}
  else if(f.state==='jump'){const v=f.vy/1200;sy=1-v*.12;sx=1+v*.08;rot=f.vy*.00012*f.face;}
  else if(f.state==='stun'){ox=Math.sin(t*60)*4;}
  else if(f.state==='win'){oy=-Math.abs(Math.sin(t*6))*30;}
  else if(f.state==='ko'){rot=0;}
  if(f.shake>0)ox+=rand(-7,7);
  const gx=f.x,gy=groundY;
  // shadow
  const hgt=-f.y;ctx.fillStyle='rgba(40,20,70,.28)';ctx.beginPath();ctx.ellipse(gx,gy+4,m.w*.38*sc*Math.max(.4,1-hgt/600),14*sc*Math.max(.4,1-hgt/600),0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(gx+ox,gy+f.y+oy);ctx.rotate(rot);ctx.scale(f.face*sc*sx,sc*sy);
  if(f.giant>0){ctx.shadowColor='#ff6fd8';ctx.shadowBlur=30;}
  if(f.speedUp>0&&f.state==='walk'){ctx.globalAlpha=.3;ctx.drawImage(img,-m.ax-40,-m.h);ctx.globalAlpha=1;}
  ctx.drawImage(img,-m.ax,-m.h);
  ctx.shadowBlur=0;
  if(f.flash>0&&WHITE[key]){ctx.globalAlpha=Math.min(1,f.flash/.12)*.85;ctx.drawImage(WHITE[key],-m.ax,-m.h);ctx.globalAlpha=1;}
  ctx.restore();
  if(f.state==='stun'){ // little circling stars over head
    for(let i=0;i<3;i++){const a=t*5+i*2.1;const sx2=gx+Math.cos(a)*50*sc,sy2=gy+f.y-m.h*sc-10+Math.sin(a)*12;drawStar(sx2,sy2,14,'#ffd23f');}}
}
function drawStar(x,y,r,c){ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#1d1230';ctx.stroke();ctx.restore();}
function drawText(t){const k=t.t/t.life,pop=k<.15?k/.15*1.2:k<.25?1.2-(k-.15)*2:1;ctx.save();ctx.translate(t.x,t.y-k*40);ctx.rotate(t.rot);ctx.scale(pop*t.size,pop*t.size);ctx.globalAlpha=k>.75?1-(k-.75)/.25:1;
  ctx.font='64px "Lilita One","Arial Rounded MT Bold",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=14;ctx.strokeStyle='#1d1230';ctx.strokeText(t.txt,0,0);ctx.fillStyle=t.color;ctx.fillText(t.txt,0,0);ctx.restore();}
function render(now){
  const t=now/1000;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#2a1846';ctx.fillRect(0,0,cv.width,cv.height);
  let sh=G&&G.shake>0?G.shake*28:0;ctx.setTransform(S,0,0,S,rand(-sh,sh)*S,rand(-sh,sh)*S);
  const bg=IMG.arena;if(bg){const w=1672*bgS,h=941*bgS;ctx.drawImage(bg,(VW-w)/2,VH-h,w,h);}
  if(!G){return;}
  // items & box
  for(const it of G.items){const im=IMG[it.type];if(!im)continue;if(it.life<2&&Math.floor(it.t*10)%2)continue;const s=.42,bob=it.landed?Math.sin(it.t*5)*6:0;
    ctx.fillStyle='rgba(40,20,70,.22)';ctx.beginPath();ctx.ellipse(it.x,groundY+2,40,9,0,0,Math.PI*2);ctx.fill();
    ctx.drawImage(im,it.x-im.width*s/2,groundY+it.y-im.height*s-8+bob,im.width*s,im.height*s);}
  if(G.box&&IMG.box){const b=G.box,im=IMG.box,s=.42,wob=b.landed?Math.sin(b.t*8)*.06:0;ctx.fillStyle='rgba(40,20,70,.25)';ctx.beginPath();ctx.ellipse(b.x,groundY+2,55,11,0,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(b.x,groundY+b.y);ctx.rotate(wob);ctx.drawImage(im,-im.width*s/2,-im.height*s,im.width*s,im.height*s);ctx.restore();}
  // fighters: the one attacking drawn on top
  const order=[G.cpu,G.me].sort((a,b)=>(a.state==='attack')-(b.state==='attack'));
  for(const f of order)drawFighter(f,t);
  // fx
  for(const e of G.fx){const k=e.t/e.life;if(k<0)continue;ctx.save();ctx.translate(e.x,e.y);ctx.scale(e.face,1);
    if(e.type==='slash'){ctx.lineCap='round';for(let i=0;i<3;i++){ctx.strokeStyle=i===1?'#fff':'#ff4fb8';ctx.lineWidth=(10-i*2)*e.s;ctx.globalAlpha=1-k;ctx.beginPath();ctx.arc(-30,10+i*22-22,80*e.s+i*6,-1.1+k*.4,.6+k*.8);ctx.stroke();}}
    else if(e.type==='wave'){ctx.strokeStyle=e.color;ctx.lineCap='round';ctx.globalAlpha=1-k;for(let i=0;i<3;i++){const r=(40+k*(e.big?900:300))*(1-i*.18);ctx.lineWidth=(e.big?16:9);ctx.beginPath();ctx.arc(0,0,r,-.6,.6);ctx.stroke();}}
    ctx.restore();}
  for(const p of G.parts){const k=p.t/p.life;ctx.globalAlpha=1-k;if(p.type==='star')drawStar(p.x,p.y,p.r,p.color);else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-k*.5),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
  for(const tx of G.texts)drawText(tx);
}

/* ---------------- flow ---------------- */
function endGame(){if(phase==='result'||!G)return;phase='result';
  const meWon=!G.draw&&G.cpu.state==='ko', draw=!!G.draw;
  const w=meWon?G.me:G.cpu;if(!draw){w.state='win';}
  $('controls').classList.remove('on');input.left=input.right=false;
  const stars=meWon?(G.me.hp/G.me.maxhp>.66?3:G.me.hp/G.me.maxhp>.33?2:1):0;
  const rt=$('resTitle');rt.textContent=draw?'DRAW!':meWon?'YOU WIN!':'YOU LOSE!';rt.classList.toggle('lose',!meWon&&!draw);
  $('resultPose').src=`assets/sprites/${player}_${meWon?KIND[player].win:draw?'surprised':'sleep'}.png`;
  [...$('resStars').children].forEach((s,i)=>s.classList.toggle('off',i>=stars));
  $('resText').textContent=meWon?(stars===3?'Purr-fect! Almost no scratches.':'Nice fight! Try for 3 stars.'):draw?'Nobody won this time.':`The ${KIND[player==='cat'?'dog':'cat'].name.toLowerCase()} won. Rematch?`;
  sfx(meWon?'win':'lose');
  setTimeout(()=>{$('result').hidden=false;},700);
}
function toTitle(){phase='title';G=null;['result','pause'].forEach(id=>$(id).hidden=true);$('title').hidden=false;$('hud').hidden=true;$('hud').classList.remove('on');$('power').hidden=true;$('controls').classList.remove('on');}
function setPause(p){if(phase!=='fight'&&phase!=='count')return;paused=p;$('pause').hidden=!p;input.left=input.right=false;}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{audio();player=c.dataset.k;document.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',x===c));sfx('pick');}));
$('playBtn').addEventListener('click',()=>{audio();try{const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{});}catch(e){}ready.then(newGame);});
$('againBtn').addEventListener('click',()=>{audio();newGame();});
$('menuBtn').addEventListener('click',toTitle);
$('pauseBtn').addEventListener('click',()=>setPause(true));
$('resumeBtn').addEventListener('click',()=>setPause(false));
$('quitBtn').addEventListener('click',toTitle);
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent='Sound: '+(soundOn?'on':'off');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='fight')setPause(true);});

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused&&!(window.matchMedia&&matchMedia('(orientation:portrait)').matches&&('ontouchstart' in window)))update(dt);render(now);requestAnimationFrame(loop);}
resize();requestAnimationFrame(loop);
})();
</script>
