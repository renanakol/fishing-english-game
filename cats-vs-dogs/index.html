<meta charset="utf-8">
<title>Cats vs Dogs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-screen landscape stage. HUD (health, power, rounds) pinned top; one slim row of controls along the bottom edge; fighters stand above it. Single look (dusk-purple yard). */
:root{
  --ink:#1d1230;        /* the thick outline colour of the drawings */
  --plum:#7a3fc4;       /* cat purple */
  --plum-soft:#b98ae8;
  --tang:#f28a1e;       /* dog orange */
  --sun:#ffd23f;        /* buttons, VS, stars */
  --cream:#fff4e2;      /* panels */
  --mint:#3fe0d0;       /* power meter */
  --hp:#7bdc3a;
  --hp-low:#ff5a4e;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;}
[hidden]{display:none!important;}
body{background:#2a1846;color:var(--cream);font-family:var(--body);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;inset:0;overflow:hidden;background:#2a1846;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
button{font-family:var(--display);cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px;}
.outl{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(60px,calc(env(safe-area-inset-right,0px) + 56px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;}
.side{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;max-width:42%;}
.side.r{flex-direction:row-reverse;}
.portrait{width:clamp(40px,11vh,58px);height:clamp(40px,11vh,58px);border-radius:50%;border:4px solid var(--ink);background:#fff center/cover no-repeat;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.35);}
.barwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.side.r .barwrap{align-items:flex-end;}
.nm{display:flex;gap:6px;align-items:center;}
.side.r .nm{flex-direction:row-reverse;}
.name{font-family:var(--display);font-size:clamp(12px,3.4vh,18px);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wins{display:flex;gap:3px;}
.wins i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:#5b437a;}
.wins i.on{background:var(--sun);}
.bar{width:100%;height:clamp(11px,3.4vh,18px);border:3px solid var(--ink);border-radius:999px;background:#3b2457;overflow:hidden;position:relative;}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(#a6f06a,var(--hp) 55%,#52b51f);border-radius:999px;transition:width .15s;}
.side.r .bar i{inset:0 0 0 auto;}
.bar i.low{background:linear-gradient(#ff9a8f,var(--hp-low) 55%,#c7302a);}
.bar b{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.6;border-radius:999px;}
.side.r .bar b{inset:0 0 0 auto;}
.pow{display:flex;align-items:center;gap:4px;}
.side.r .pow{flex-direction:row-reverse;}
.pow img{width:clamp(20px,6vh,30px);filter:drop-shadow(0 2px 0 rgba(0,0,0,.4));}
.segs{display:flex;gap:2px;padding:2px;border:3px solid var(--ink);border-radius:999px;background:#3b2457;}
.segs span{width:clamp(10px,2.6vw,18px);height:clamp(7px,2.2vh,11px);border-radius:4px;background:#5b437a;}
.segs span.on{background:linear-gradient(#a8fff6,var(--mint));}
.pow.full .segs{animation:glow .6s infinite alternate;}
@keyframes glow{to{box-shadow:0 0 12px 3px var(--sun);border-color:#7a4b00;}}
#mid{display:flex;flex-direction:column;align-items:center;flex:none;}
#round{font-family:var(--display);font-size:clamp(10px,2.8vh,14px);letter-spacing:.08em;}
#timer{font-family:var(--display);font-size:clamp(18px,5.4vh,30px);background:var(--ink);color:#fff;border-radius:12px;padding:0 10px;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center;}
#timer.hot{color:var(--hp-low);}
#pauseBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:var(--plum);color:#fff;font-size:16px;box-shadow:0 3px 0 var(--ink);}

/* ---------- controls: one slim row along the bottom ---------- */
#controls{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px));}
#controls.on{display:flex;}
.pad{display:flex;gap:8px;pointer-events:auto;align-items:flex-end;}
.ctl{--s:clamp(46px,15vh,68px);width:var(--s);height:var(--s);border-radius:50%;border:4px solid var(--ink);padding:0;background:var(--plum) center/cover no-repeat;
  box-shadow:0 4px 0 var(--ink);position:relative;touch-action:none;transition:transform .06s, filter .2s;color:#fff;flex:none;}
.ctl.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.ctl.arrow{background:linear-gradient(#a26ae6,var(--plum));font-size:calc(var(--s)*.4);line-height:1;text-shadow:0 3px 0 var(--ink);}
.ctl .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(29,18,48,.72) var(--p,0%),transparent 0);pointer-events:none;}
#spBtn{--s:clamp(52px,17vh,76px);background:radial-gradient(circle at 50% 40%,#fff3a8,var(--sun) 60%,#e5a400);font-size:calc(var(--s)*.46);filter:grayscale(.85) brightness(.75);}
#spBtn.ready{filter:none;animation:pulse .7s infinite alternate;}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 4px 0 var(--ink),0 0 22px 6px var(--sun);}}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px));}
.dim{background:rgba(29,18,48,.55);}
#title{gap:clamp(12px,4vw,40px);}
#title .logo{width:min(40vw,62vh);filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg);}}
.pick{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2vh,14px);}
.h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(18px,5.5vh,30px);letter-spacing:.03em;color:#fff;text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);}
.cards{display:flex;gap:clamp(8px,2vw,18px);}
.card{width:clamp(120px,22vw,190px);color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 var(--ink);transition:transform .15s;}
.card img{height:clamp(70px,26vh,150px);object-fit:contain;}
.card .cn{font-family:var(--display);font-size:clamp(16px,4.6vh,24px);}
.card .tag{font-size:clamp(10px,2.8vh,13px);font-weight:600;opacity:.75;}
.card.cat{background:linear-gradient(#f6e9ff,#e3c7ff);}
.card.dog{background:linear-gradient(#fff2df,#ffd6a6);}
.card:active{transform:scale(.97);}
.imgbtn{background:none;border:0;padding:0;}
.imgbtn img{height:clamp(48px,14vh,80px);display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3));transition:transform .1s;}
.imgbtn:active img{transform:scale(.95);}
.hint{font-size:clamp(10px,2.6vh,13px);opacity:.9;text-align:center;max-width:46ch;}
.panel{background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:clamp(10px,3vh,22px) clamp(14px,3.5vw,30px);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2vh,12px);text-align:center;max-height:100%;min-width:0;}
.panel h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,10vh,58px);line-height:1;color:var(--sun);text-shadow:0 4px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink);}
.panel h1.lose{color:var(--plum-soft);}
.panel p{margin:0;font-weight:600;font-size:clamp(12px,3.4vh,16px);}
.stars{display:flex;gap:6px;}
.stars img{width:clamp(30px,10vh,52px);}
.stars img.off{filter:grayscale(1) brightness(1.6) opacity(.45);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{border:4px solid var(--ink);border-radius:999px;background:var(--plum);color:#fff;font-size:clamp(14px,4vh,20px);padding:6px 18px;box-shadow:0 4px 0 var(--ink);}
.pill.alt{background:#fff;color:var(--ink);}
#resultPose{height:clamp(60px,22vh,140px);max-width:100%;}

/* ---------- designer ---------- */
#design{gap:clamp(10px,2.5vw,24px);align-items:stretch;}
#design .preview{flex:1 1 44%;justify-content:space-between;background:radial-gradient(circle at 50% 70%,#fff,#efe2ff);}
#design .preview.dog{background:radial-gradient(circle at 50% 70%,#fff,#ffe8cc);}
#pcv{width:100%;flex:1;min-height:0;cursor:pointer;}
#nameIn{font-family:var(--display);font-size:clamp(16px,4.6vh,24px);text-align:center;width:min(100%,14em);border:4px solid var(--ink);border-radius:999px;padding:4px 12px;background:#fff;color:var(--ink);}
#design .opts{flex:1 1 56%;align-items:stretch;text-align:left;overflow:auto;gap:clamp(4px,1.6vh,10px);}
.lbl{font-family:var(--display);font-size:clamp(14px,4vh,20px);}
.sw{display:flex;flex-wrap:wrap;gap:8px;}
.sw button{width:clamp(30px,9vh,42px);height:clamp(30px,9vh,42px);border-radius:50%;border:4px solid var(--ink);padding:0;box-shadow:0 3px 0 var(--ink);}
.sw button.sel{transform:scale(1.15);box-shadow:0 0 0 4px var(--sun),0 3px 0 var(--ink);}
.seg{display:flex;flex-wrap:wrap;gap:6px;}
.seg button{border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font-size:clamp(12px,3.4vh,16px);padding:4px 10px;box-shadow:0 3px 0 var(--ink);}
.seg button.sel{background:var(--sun);}
.dstats{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:clamp(10px,2.8vh,13px);font-weight:700;}
.dstats u{display:block;height:8px;border-radius:9px;background:rgba(29,18,48,.15);overflow:hidden;text-decoration:none;}
.dstats u i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .25s;}
.small{font-size:clamp(10px,2.6vh,12px);opacity:.7;font-weight:600;}

#banner{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%) scale(0);font-family:var(--display);font-size:clamp(26px,9vh,56px);white-space:nowrap;color:var(--sun);
  text-shadow:0 4px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink);pointer-events:none;}
#banner.show{animation:pop 1.6s ease-out forwards;}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg);}15%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);}25%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);}80%{opacity:1;}100%{transform:translate(-50%,-60%) scale(1);opacity:0;}}
#rotate{background:#2a1846;flex-direction:column;gap:14px;z-index:20;display:none;font-family:var(--display);font-size:22px;text-align:center;}
#rotate .ph{width:54px;height:90px;border:5px solid var(--cream);border-radius:12px;animation:turn 1.6s ease-in-out infinite;}
@keyframes turn{40%,60%{transform:rotate(-90deg);}}
@media (orientation:portrait){#rotate{display:flex;}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;}}
</style>

<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="side l"><div class="portrait" id="pL"></div><div class="barwrap">
      <div class="nm"><div class="name outl" id="nL">CAT</div><div class="wins" id="wL"><i></i><i></i></div></div>
      <div class="bar"><b id="gL"></b><i id="hL"></i></div>
      <div class="pow" id="powL"><img id="fL" src="assets/ui/fish.png" alt=""><div class="segs"></div></div></div></div>
    <div id="mid"><div id="round" class="outl">ROUND 1</div><div id="timer">45</div></div>
    <div class="side r"><div class="portrait" id="pR"></div><div class="barwrap">
      <div class="nm"><div class="name outl" id="nR">DOG</div><div class="wins" id="wR"><i></i><i></i></div></div>
      <div class="bar"><b id="gR"></b><i id="hR"></i></div>
      <div class="pow" id="powR"><img id="fR" src="assets/ui/bone.png" alt=""><div class="segs"></div></div></div></div>
  </div>
  <button id="pauseBtn" aria-label="Pause" hidden>❚❚</button>

  <div id="controls">
    <div class="pad">
      <button class="ctl arrow" id="bLeft" aria-label="Move left">◀</button>
      <button class="ctl arrow" id="bRight" aria-label="Move right">▶</button>
    </div>
    <div class="pad" id="atkPad"></div>
  </div>

  <div id="banner"></div>

  <!-- 1. Title: choose cat or dog -->
  <div class="ov dim" id="title">
    <img class="logo" src="assets/ui/logo.png" alt="Cats vs Dogs">
    <div class="pick">
      <h2 class="h2">Who do you want to be?</h2>
      <div class="cards">
        <button class="card cat" data-k="cat"><img src="assets/sprites/cat_stand.png" alt=""><span class="cn">Cat</span><span class="tag">fast · jumps · scratches</span></button>
        <button class="card dog" data-k="dog"><img src="assets/sprites/dog_stand.png" alt=""><span class="cn">Dog</span><span class="tag">strong · barks · charges</span></button>
      </div>
      <div class="hint">Next: design your own fighter!</div>
    </div>
  </div>

  <!-- 2. Designer -->
  <div class="ov dim" id="design" hidden>
    <div class="panel preview" id="prevPanel">
      <canvas id="pcv" aria-label="Your fighter"></canvas>
      <input id="nameIn" maxlength="10" placeholder="Name" aria-label="Fighter name" autocomplete="off" spellcheck="false">
      <div class="small">Tap your fighter to see a move</div>
    </div>
    <div class="panel opts">
      <div class="lbl">Fur color</div><div class="sw" id="swatches"></div>
      <div class="lbl">Body</div><div class="seg" id="bodies"></div>
      <div class="dstats" id="dStats"></div>
      <div class="row" style="justify-content:space-between;margin-top:auto">
        <button class="pill alt" id="backBtn">Back</button>
        <button class="pill alt" id="randBtn">🎲 Random</button>
        <button class="imgbtn" id="fightBtn" aria-label="Fight"><img src="assets/ui/btn_play.png" alt=""></button>
      </div>
    </div>
  </div>

  <!-- Result -->
  <div class="ov dim" id="result" hidden>
    <div class="panel">
      <h1 id="resTitle">YOU WIN!</h1>
      <canvas id="resCv" width="300" height="200" style="height:clamp(60px,22vh,140px)"></canvas>
      <div class="stars" id="resStars"><img src="assets/ui/star.png" alt=""><img src="assets/ui/star.png" alt=""><img src="assets/ui/star.png" alt=""></div>
      <p id="resText"></p>
      <div class="row">
        <button class="imgbtn" id="againBtn" aria-label="Play again"><img src="assets/ui/btn_play.png" alt=""></button>
        <button class="pill alt" id="editBtn">Edit fighter</button>
        <button class="pill alt" id="menuBtn">Menu</button>
      </div>
    </div>
  </div>

  <!-- Pause -->
  <div class="ov dim" id="pause" hidden>
    <div class="panel">
      <h1>PAUSED</h1>
      <div class="row">
        <button class="pill" id="resumeBtn">Resume</button>
        <button class="pill alt" id="soundBtn">Sound: on</button>
        <button class="pill alt" id="quitBtn">Quit</button>
      </div>
    </div>
  </div>

  <div class="ov" id="rotate"><div class="ph"></div>Turn your phone sideways</div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ---------------- assets ---------------- */
const META={"cat_stand":{"w":257,"h":233,"ax":134},"cat_walk":{"w":256,"h":184,"ax":117},"cat_scratch":{"w":290,"h":223,"ax":130},"cat_jump":{"w":289,"h":185,"ax":121},"cat_bite":{"w":301,"h":210,"ax":161},"cat_hiss":{"w":257,"h":233,"ax":133},"cat_ready":{"w":251,"h":219,"ax":122},"cat_surprised":{"w":247,"h":230,"ax":116},"cat_hit":{"w":262,"h":229,"ax":143},"cat_sleep":{"w":272,"h":205,"ax":141},"dog_stand":{"w":223,"h":201,"ax":105},"dog_walk":{"w":219,"h":165,"ax":91},"dog_bite":{"w":283,"h":191,"ax":102},"dog_bark":{"w":261,"h":205,"ax":99},"dog_charge":{"w":300,"h":167,"ax":128},"dog_ready":{"w":235,"h":223,"ax":100},"dog_surprised":{"w":217,"h":192,"ax":99},"dog_tongue":{"w":242,"h":184,"ax":107},"dog_hit":{"w":216,"h":201,"ax":109},"dog_sleep":{"w":292,"h":181,"ax":145}};
const ICONS=['atk_cat_slash','atk_cat_jump','atk_cat_bite','atk_cat_hiss','atk_dog_bite','atk_dog_bark','atk_dog_charge'];
const IMG={}, WHITE={};
function load(key,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[key]=i;r();};i.onerror=()=>r();i.src=src;});}
const loads=[load('arena','assets/arena.jpg'),load('fish','assets/ui/fish.png'),load('bone','assets/ui/bone.png'),load('box','assets/ui/box.png')];
for(const k in META) loads.push(load(k,'assets/sprites/'+k+'.png'));
for(const k of ICONS) loads.push(load(k,'assets/ui/'+k+'.png'));
const ready=Promise.all(loads).then(()=>{for(const k in META){const i=IMG[k];if(!i)continue;const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const g=c.getContext('2d');g.drawImage(i,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);WHITE[k]=c;}});

/* ---------------- fur colors (recolor the drawings) ---------------- */
// Only the fur hues are shifted: purple for the cat, orange for the dog. Outlines, cream belly, eyes, bandana and collar stay.
const FUR={cat:{lo:250,hi:336,minS:.17,guard:318,base:[200,105,220]},dog:{lo:8,hi:44,minS:.28,guard:999,base:[246,156,52]}};
const COLORS={
  cat:[{n:'Purple',dh:0,s:1,v:1},{n:'Ginger',dh:100,s:1,v:1.05},{n:'Sky',dh:-85,s:.9,v:1.05},{n:'Mint',dh:-130,s:.8,v:1.05},{n:'Lemon',dh:130,s:.9,v:1.15},{n:'Rose',dh:45,s:1,v:1.05},{n:'Smoke',dh:0,s:.12,v:.95},{n:'Midnight',dh:-30,s:.35,v:.45}],
  dog:[{n:'Orange',dh:0,s:1,v:1},{n:'Choco',dh:-4,s:.85,v:.6},{n:'Golden',dh:14,s:.75,v:1.12},{n:'Silver',dh:0,s:.1,v:.85},{n:'Night',dh:220,s:.3,v:.42},{n:'Blue',dh:185,s:.8,v:1},{n:'Bubblegum',dh:300,s:.75,v:1.1},{n:'Lime',dh:70,s:.85,v:1}]};
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return[h,mx?d/mx:0,mx];}
function hsv2rgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[(r+m)*255,(g+m)*255,(b+m)*255];}
function shiftPix(kind,col,r,g,b){const F=FUR[kind];let[h,s,v]=rgb2hsv(r,g,b);if(s<F.minS||v<.22||h<F.lo||h>F.hi||(h>F.guard&&s>.6))return null;h=((h+col.dh)%360+360)%360;s=Math.min(1,s*col.s);v=Math.min(1,v*col.v);return hsv2rgb(h,s,v);}
function swatchCss(kind,col){const[r,g,b]=FUR[kind].base,p=shiftPix(kind,col,r,g,b)||[r,g,b];return`rgb(${p.map(Math.round).join(',')})`;}
const recolorCache={};
function recolorImg(img,kind,col){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.drawImage(img,0,0);
  if(col.dh===0&&col.s===1&&col.v===1)return c;
  try{const d=g.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){if(a[i+3]<8)continue;const p=shiftPix(kind,col,a[i],a[i+1],a[i+2]);if(p){a[i]=p[0];a[i+1]=p[1];a[i+2]=p[2];}}g.putImageData(d,0,0);}catch(e){}
  return c;}
function skin(kind,ci){const key=kind+ci;if(recolorCache[key])return recolorCache[key];const col=COLORS[kind][ci],set={};
  for(const k in META)if(k.startsWith(kind+'_')&&IMG[k])set[k]=recolorImg(IMG[k],kind,col);
  for(const k of ICONS)if(k.includes('_'+kind+'_')&&IMG[k]){const c=recolorImg(IMG[k],kind,col);set[k]=c;set[k+'_url']=c.toDataURL();}
  return recolorCache[key]=set;}

let AC=null, soundOn=true;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f1,f2,dur,type='square',vol=.15,delay=0){if(!AC||!soundOn)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,f,q=1,vol=.25,type='bandpass'){if(!AC||!soundOn)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(AC.destination);s.start(t);}

/* ---------------- combat ---------------- */
const canAct=f=>['idle','walk'].includes(f.state);
function tryAttack(f,name){const A=f.K.attacks[name];if(!A||!canAct(f)||(f.cds[name]||0)>0)return false;
  if(name==='jump'){if(f.y<0)return false;f.cds.jump=A.cd;f.state='jump';f.t=0;f.vy=-1200;const dir=f===G.me?(input.right?1:input.left?-1:f.face):(f.ai.move||f.face);f.vx=dir*500;f.pounced=false;sfx('jump');burst(f.x,groundY,'#fff',6,140,'dust');return true;}
  f.cds[name]=A.cd;f.state='attack';f.atk=A;f.atkName=name;f.t=0;f.hitDone=false;return true;}
function opponent(f){return f===G.me?G.cpu:G.me;}
function applyHit(att,tgt,A,mult=1){
  if(tgt.state==='ko'||G.over)return;
  let d=A.dmg*(att.giant>0?1.8:1)*att.B.dmg*mult; if(tgt.giant>0)d*=.5; if(att.ai)d*=.8;
  tgt.hp=Math.max(0,tgt.hp-d);tgt.flash=.12;tgt.shake=.25;tgt.combo=0;
  att.power=Math.min(100,att.power+6);
  // combo counter
  att.combo=att.comboT>0?att.combo+1:1;att.comboT=1.3;
  if(att.combo>=3){comic(att.combo+' HIT COMBO!',att.x,groundY-scaleOf(att)*300,'#ff6fd8',.9,.9);if(att.combo===3){att.power=Math.min(100,att.power+15);sfx('combo');}}
  const dir=Math.sign(tgt.x-att.x)||att.face;
  if(A.stun){tgt.state='stun';tgt.t=0;tgt.stunT=A.stun;tgt.vx=dir*(A.kb||60)*.4;}
  else{tgt.state='hurt';tgt.t=0;tgt.vx=dir*(A.kb||150);if(A.kb>=240)tgt.vy=-420;}
  if(tgt.y<0&&!A.stun){tgt.vy=Math.min(tgt.vy,-300);}
  G.freeze=A.dmg>=10?.09:.05; // hit-stop: a tiny pause makes hits feel strong
  G.shake=Math.max(G.shake,A.dmg>10?.28:.14);
  burst(tgt.x,groundY+tgt.y-110*scaleOf(tgt),'#ffd23f',10,380,'star');
  if(A.dmg>=10&&Math.random()<.5)comic(pick(['POW!','BAM!','WHAM!']),tgt.x+rand(-40,40),groundY+tgt.y-scaleOf(tgt)*240,'#ffd23f',1,.6);
  sfx('hit');
  if(tgt.hp<=0)ko(tgt,att);
}
function hurtByWorld(f,dmg,vy,txt){if(f.state==='ko'||G.over)return;f.hp=Math.max(0,f.hp-dmg);f.flash=.12;f.state='hurt';f.t=0;f.vy=vy;f.vx=rand(-200,200);f.combo=0;G.shake=.2;sfx('hit');comic(txt,f.x,groundY-260,'#fff',1,.7);burst(f.x,groundY-80,'#ffd23f',8,300,'star');if(f.hp<=0)ko(f,opponent(f));}
function ko(loser,winner){loser.state='ko';loser.t=0;loser.vx=Math.sign(loser.x-winner.x)*320;loser.vy=-520;G.over=true;G.slow=1.2;sfx('ko');comic('K.O.!',VW/2,VH*.4,'#ff5a4e',2.2,1.6);setTimeout(()=>roundOver(winner),2300);}
function special(f){if(f.power<100||!canAct(f))return;f.power=0;sfx('special');G.shake=.5;
  if(f.kind==='cat'){f.giant=6;comic(f.K.special,f.x,groundY-330,'#ff6fd8',1.6,1.3);burst(f.x,groundY-100,'#ff6fd8',26,600,'star');}
  else{f.state='attack';f.atk={pose:'bark',wind:.15,act:.5,rec:.4,range:9999,dmg:18,stun:1.6,air:true,snd:'bark',fx:'tornado',kb:300};f.atkName='tornado';f.t=0;f.hitDone=false;comic(f.K.special,f.x,groundY-330,'#ffd23f',1.6,1.3);}
  banner(f.K.special);
}
function inRange(att,tgt,A){const reach=A.range*(att.giant>0?1.45:1)*(scaleOf(att)/1.2);const dx=(tgt.x-att.x)*att.face;
  if(dx<-40||Math.abs(tgt.x-att.x)>reach)return false;if(!A.air&&tgt.y<-110)return false;return true;}

/* ---------------- AI ---------------- */
function aiThink(f){const o=G.me,A=f.K.attacks,dx=o.x-f.x,dist=Math.abs(dx),ai=f.ai;ai.think=rand(.24,.46);ai.move=0;
  if(!canAct(f))return;
  if(G.vac&&G.vac.warn<=0&&f.kind==='cat'&&Math.abs(G.vac.x-f.x)<260&&(f.cds.jump||0)<=0&&Math.random()<.7){tryAttack(f,'jump');return;}
  if(f.power>=100&&(f.kind==='dog'||dist<450)){special(f);return;}
  const mine=G.items.filter(i=>i.type===f.K.food&&i.landed);
  let goal=null;for(const it of mine){if(Math.abs(it.x-f.x)<Math.abs(it.x-o.x)+120&&(!goal||Math.abs(it.x-f.x)<Math.abs(goal.x-f.x)))goal=it;}
  if(!goal&&G.box&&G.box.landed&&Math.abs(G.box.x-f.x)<Math.abs(G.box.x-o.x))goal=G.box;
  if(goal&&dist>200){ai.move=Math.sign(goal.x-f.x);return;}
  const opts=[];
  for(const n in A){const a=A[n];if((f.cds[n]||0)>0)continue;
    if(n==='jump'){if(o.state==='attack'&&dist<260&&Math.random()<.45)opts.push([n,3]);else if(dist>250&&dist<520&&Math.random()<.25)opts.push([n,1]);continue;}
    if(a.dash){if(dist>220&&dist<700)opts.push([n,1.5]);continue;}
    if(inRange(f,o,a))opts.push([n,a.stun?(o.state==='stun'?0:1.2):a.dmg>10?2:3]);}
  if(opts.length&&Math.random()<.68){let s=opts.reduce((a,b)=>a+b[1],0),r=Math.random()*s;for(const [n,w] of opts){r-=w;if(r<=0){tryAttack(f,n);return;}}}

/* ---------------- update ---------------- */
function updFighter(f,dt){const K=f.K,o=opponent(f);f.t+=dt;

  f.giant=Math.max(0,f.giant-dt);f.speedUp=Math.max(0,f.speedUp-dt);f.flash=Math.max(0,f.flash-dt);f.shake=Math.max(0,f.shake-dt);f.comboT=Math.max(0,f.comboT-dt);

  if(f.state==='idle'||f.state==='walk'){
    let move=f.ai?f.ai.move:(input.right?1:0)-(input.left?1:0);
    if(G.over||phase!=='fight')move=0;
    const target=move*spd;f.vx=G.rain>0?f.vx+(target-f.vx)*Math.min(1,dt*2.2):target; // slippery when wet
    f.state=move?'walk':'idle';if(move)f.walkT+=dt;
    f.face=Math.sign(o.x-f.x)||f.face;

    const A=f.atk,tot=A.wind+A.act+A.rec;
    if(A.dash){f.vx=f.t>A.wind&&f.t<A.wind+A.act?f.face*A.dash:f.vx*.85;
      if(!f.hitDone&&f.t>A.wind&&f.t<A.wind+A.act&&Math.abs(o.x-f.x)<150*scaleOf(f)&&o.y>-110){f.hitDone=true;applyHit(f,o,A);f.vx*=.2;}
      if(f.t>A.wind&&Math.random()<.5)burst(f.x-f.face*60,groundY,'#fff',1,120,'dust');}
    else{f.vx*=G.rain>0?.97:.8;if(!f.hitDone&&f.t>=A.wind){f.hitDone=true;if(A.snd)sfx(A.snd);fxFor(f,A);
      if(A.fx==='tornado'||inRange(f,o,A))applyHit(f,o,A);}}
    if(f.t>=tot){f.state='idle';f.atk=null;}
  } else if(f.state==='jump'){
    if(!f.pounced&&f.vy>0&&Math.abs(o.x-f.x)<140*scaleOf(f)&&f.y>-170&&o.state!=='ko'){f.pounced=true;applyHit(f,o,{dmg:9,kb:260},1);comic('POUNCE!',o.x,groundY-300,'#ff6fd8',1,.7);}
  } else if(f.state==='hurt'){f.vx*=G.rain>0?.97:.88;if(f.t>.32&&f.y>=0)f.state='idle';}

  if(f.x<90){f.x=90;if(f.vx<-300)f.vx*=-.5;} if(f.x>VW-90){f.x=VW-90;if(f.vx>300)f.vx*=-.5;}
}
function fxFor(f,A){const sc=scaleOf(f),x=f.x+f.face*120*sc,y=groundY+f.y-110*sc;

  else if(A.fx==='chomp'){comic(pick(['CHOMP!','NOM!','CRUNCH!']),x,y-90,'#fff',.9,.6);}

function update(dt){

    for(const f of [G.me,G.cpu]){if(f.K.food===it.type&&f.state!=='ko'&&Math.abs(f.x-it.x)<95*scaleOf(f)&&f.y>-160&&it.y>-200){it.life=-1;f.power=Math.min(100,f.power+34);sfx('pick');burst(it.x,groundY-40,'#3fe0d0',12,300,'star');comic('+POWER',it.x,groundY-200,'#3fe0d0',.8,.7);}}}

    else if(!G.over)for(const f of [G.me,G.cpu]){if(f.state!=='ko'&&Math.abs(f.x-bx.x)<100*scaleOf(f)&&f.y>-150){openBox(f);break;}}}
  // robot vacuum: runs across the floor, jump over it!
  if(G.vac){const v=G.vac;v.t+=dt;if(v.warn>0)v.warn-=dt;else{v.x+=v.dir*620*dt;
      for(const f of [G.me,G.cpu]){if(!v.hit.has(f)&&Math.abs(f.x-v.x)<110&&f.y>-70){v.hit.add(f);hurtByWorld(f,6,-950,'BONK!');}}
      if(v.x<-260||v.x>VW+260)G.vac=null;}}
  if(G.rain>0){G.rain-=dt;for(let i=0;i<3;i++)G.parts.push({x:rand(0,VW),y:rand(-40,VH*.3),vx:rand(-40,40),vy:rand(700,900),life:.9,t:0,color:'#7fd6ff',type:'drop',r:6,rot:0});}
  // effects
  for(const p of G.parts){p.t+=dt;p.vy+=(p.type==='drop'?400:900)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*6;if(p.type==='drop'&&p.y>groundY){p.t=p.life;}}

}

function drawStar(c,x,y,r,col){c.save();c.translate(x,y);c.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i*Math.PI/5-Math.PI/2;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();c.fillStyle=col;c.fill();c.lineWidth=3;c.strokeStyle='#1d1230';c.stroke();c.restore();}

  [...$('bodies').children].forEach((b,i)=>b.classList.toggle('sel',i===player.body));
  const K=KIND[player.kind],B=BODIES[player.body];
  prev={kind:player.kind,K,B,skin:skin(player.kind,player.color),state:'idle',t:0,face:1,y:0,giant:0,speedUp:0,flash:0,shake:0,walkT:0};
  const hp=K.hp*B.hp,spd=K.speed*B.spd,pw=(player.kind==='cat'?60:85)*B.dmg;
  $('dStats').innerHTML=`<span>Health</span><u><i style="width:${Math.min(100,hp/1.5)}%"></i></u><span>Speed</span><u><i style="width:${Math.min(100,spd/6)}%"></i></u><span>Power</span><u><i style="width:${Math.min(100,pw)}%"></i></u>`;
  store.set('cvd-fighter',player);
}
pcv.addEventListener('pointerdown',()=>{if(!prev)return;audio();const names=Object.keys(prev.K.attacks).filter(n=>!prev.K.attacks[n].jump&&!prev.K.attacks[n].dash);const n=pick(names),A=prev.K.attacks[n];prev.state='attack';prev.atk=A;prev.t=0;sfx(A.snd);});
$('nameIn').addEventListener('input',e=>{player.name=e.target.value.replace(/[^\p{L}\p{N} ]/gu,'').slice(0,10);store.set('cvd-fighter',player);});
function renderPrev(now,dt){if(phase!=='design'||!prev||!pcv.width)return;prev.t+=dt;
  if(prev.state==='attack'&&prev.t>prev.atk.wind+prev.atk.act+prev.atk.rec+.25){prev.state='idle';}
  pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,pcv.width,pcv.height);
  const h=pcv.height,w=pcv.width,s=h/290;pctx.setTransform(1,0,0,1,0,0);
  drawFighter(pctx,prev,now/1000,w/2-10*s,h-14*s,s*prev.B.sc*(prev.kind==='dog'?1.05:1));}

/* ---------------- flow ---------------- */
function endMatch(){phase='result';
  const meWon=G.me.wins>G.cpu.wins, draw=G.me.wins===G.cpu.wins;
  $('controls').classList.remove('on');input.left=input.right=false;
  const stars=meWon?(G.cpu.wins===0?(G.me.hp/G.me.maxhp>.5?3:2):1):0;
  const rt=$('resTitle');rt.textContent=draw?'DRAW!':meWon?'YOU WIN!':'YOU LOSE!';rt.classList.toggle('lose',!meWon&&!draw);
  resPose={kind:player.kind,K:G.me.K,B:G.me.B,skin:G.me.skin,state:meWon?'win':draw?'stun':'ko',t:0,face:1,y:0,giant:0,speedUp:0,flash:0,shake:0,walkT:0,stunT:99};
  [...$('resStars').children].forEach((s,i)=>s.classList.toggle('off',i>=stars));
  $('resText').textContent=meWon?(stars===3?`Purr-fect! ${G.me.name} won without a scratch.`:`${G.me.name} won ${G.me.wins}–${G.cpu.wins}!`):draw?'Nobody won this time.':`${G.cpu.name} won ${G.cpu.wins}–${G.me.wins}. Rematch?`;
  sfx(meWon?'win':'lose');
  setTimeout(()=>{$('result').hidden=false;},600);
}
let resPose=null;const rcv=$('resCv'),rctx=rcv.getContext('2d');
function renderRes(now){if(phase!=='result'||!resPose||$('result').hidden)return;rctx.clearRect(0,0,300,200);drawFighter(rctx,resPose,now/1000,150,192,.75*resPose.B.sc);}
function toTitle(){phase='title';G=null;['result','pause','design'].forEach(id=>$(id).hidden=true);$('title').hidden=false;$('hud').hidden=true;$('pauseBtn').hidden=true;$('controls').classList.remove('on');}
function setPause(p){if(phase!=='fight'&&phase!=='count')return;paused=p;$('pause').hidden=!p;input.left=input.right=false;}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{audio();sfx('tap');ready.then(()=>openDesigner(c.dataset.k));}));
$('backBtn').addEventListener('click',toTitle);
$('randBtn').addEventListener('click',()=>{player.color=Math.floor(Math.random()*COLORS[player.kind].length);player.body=Math.floor(Math.random()*BODIES.length);sfx('tap');refreshDesigner();});
$('fightBtn').addEventListener('click',()=>{audio();$('nameIn').blur();try{const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{});}catch(e){}ready.then(newMatch);});
$('againBtn').addEventListener('click',()=>{audio();newMatch();});
$('editBtn').addEventListener('click',()=>{G=null;$('hud').hidden=true;$('pauseBtn').hidden=true;openDesigner();});
$('menuBtn').addEventListener('click',toTitle);
$('pauseBtn').addEventListener('click',()=>setPause(true));
$('resumeBtn').addEventListener('click',()=>setPause(false));
$('quitBtn').addEventListener('click',toTitle);
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent='Sound: '+(soundOn?'on':'off');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='fight')setPause(true);});

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  const portraitTouch=window.matchMedia&&matchMedia('(orientation:portrait)').matches&&('ontouchstart' in window);
  if(!paused&&!portraitTouch)update(dt);render(now);renderPrev(now,dt);renderRes(now);requestAnimationFrame(loop);}
resize();requestAnimationFrame(loop);
})();
</script>
